[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nztcs-wiki-bot"
version = "0.1.0"
description = "Generate a Wikipedia review queue that adds NZTCS conservation statuses to species Speciesboxes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Richard Littauer", email = "richard.littauer@gmail.com" }]
keywords = ["wikipedia", "nztcs", "conservation", "biodiversity", "mediawiki"]
dependencies = [
    "requests>=2.28",
    "mwparserfromhell>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
    "ruff>=0.4",
    "pyright>=1.1.380",
]

[project.scripts]
nztcs-wiki-bot = "nztcs_wiki_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/nztcs_wiki_bot"]
markers = [
    "live: tests that hit the real Wikipedia API (deselected by default)",
]
addopts = "-m 'not live' --doctest-modules --cov=nztcs_wiki_bot --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["*/__main__.py"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
